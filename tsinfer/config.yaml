# config.yaml for the tsinfer (+ tsdate) inference workflow

# Singularity image (tskit-v1: has bio2zarr/vcf2zarr, tsinfer, tsdate, bgzip/tabix)
singularity: "/grid/siepel/home/khalid/argsortium-inference/shared/container/arg_inference_tools.tskitv1.sif"

# Canonical params CSV (one row per region), same format as argweaver/singer/relate/threads:
#   uid, vcf_file, mu, recomb_map, output_dir, inference_start, inference_end
# plus two tsinfer-specific columns for the ancestral state:
#   ancestral_fasta  -> path to the per-sim ancestral FASTA (*.mutated.ancestral.fa.gz)
#   contig           -> contig name inside that FASTA (e.g. chr11)
# (tsinfer does NOT use recomb_map.)
params_csv: "/grid/siepel/home/khalid/argsortium-inference/tsinfer/myconfigs/2026_05_11_runs/master_params.csv"

# tsinfer outputs go here (the CSV's output_dir column points at argweaver).
output_dir: "/grid/siepel/home/khalid/argsortium-outputs/2026_05_11_simulation_sets/inferred_args/tsinfer"

# CONSTANT human recombination rate (per bp per generation). tsinfer uses this
# instead of a per-region recombination map.
recombination_rate: 1.2e-8

# Per-rule computational threads (vcf2zarr / tsinfer).
num_threads: 4
