# config.yaml for the THReaD-S inference workflow

# Singularity image (tskit-v1: has threads, plink2, smc++, bcftools, bgzip/tabix)
singularity: "/grid/siepel/home/khalid/argsortium-inference/shared/container/arg_inference_tools.tskitv1.sif"

# Canonical params CSV (one row per region). Columns:
#   uid, vcf_file, mu, recomb_map, output_dir, inference_start, inference_end,
#   demography_file
# Outputs land under each row's output_dir as {output_dir}/{uid}/{uid}.threads.*
# (mirrors relate). demography_file is a per-row Threads .demo (time<TAB>2N);
# pre-compute them from panel VCFs with scripts/make_demo.sh + slurm/submit_demos.sh.
params_csv: "/grid/siepel/home/khalid/argsortium-inference/threads/myconfigs/2026_05_11_runs/master_params.csv"

# threads infer mode: "wgs" (sequence data) or "array"
threads_mode: "wgs"

# Per-rule computational threads (plink2 / threads infer). The single SLURM job's
# total cores are set in slurm/submit_single.sh (snakemake --cores).
num_threads: 4
