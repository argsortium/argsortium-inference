# config.yaml

# Define the base VCF input file name
vcf_pattern: "/grid/siepel/home/khalid/argsortium-outputs/2025_11_27/HomSap_OutOfAfrica_3G09/YRI_0_CEU_0_CHB_15/chr*mutated.vcf.gz"

# Define the path where all output files should be placed, if empty will be placed in the same folder as input_vcf 
# Don't add / at the end of the folder name
output_dir: "/grid/siepel/home/khalid/argsortium-outputs/2025_11_27/HomSap_OutOfAfrica_3G09/YRI_0_CEU_0_CHB_15"

add_chr: True #True if the input vcf has 'chr' before chromosome number (plink removes it by default)

singularity: "../shared/container/arg_inference_tools.sif"

# Flag to remove multi-allelics (set to false to keep them)
remove_multiallelic_sites: true

# Optional minimum ALT allele frequency cutoff (set to null to disable)
maf_threshold: null

# Optional max indel length (bp). Set to 0 to keep SNPs only. Must be <= 250.
max_indel_length: 0

