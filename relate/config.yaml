# config.yaml for Relate Snakemake workflow

# Singularity image path
singularity: "/grid/siepel/home/khalid/argsortium-inference/shared/container/arg_inference_tools.sif"

# Params CSV (one row per inference task) — shared master_params.csv convention.
# Columns: uid, vcf_file, mu, recomb_map, output_dir, inference_start, inference_end
# Per-row output_dir determines where each task's outputs are written.
params_csv: "/grid/siepel/home/khalid/argsortium-inference/relate/myconfigs/2026_05_11_runs/master_params.csv"

# Config-level defaults (applied to all rows)
Ne: 20000 #In relate the Ne needs to be number of chroms not individuals (So Ne*2)
iter_start: 0
iter_end: 800
thin_every: 20  # 0 disables thinning; otherwise keep only iterations divisible by this value (plus 0 and iter_end)

# Optional: threads (not currently used by Relate commands)
threads: 1
